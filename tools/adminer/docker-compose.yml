services:
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "3500:8080"
    volumes:
      # Mount the-game production database (using named volume)
      - the-game-data:/data:ro
    environment:
      - ADMINER_DEFAULT_SERVER=sqlite
    networks:
      - tools-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.dinky.local`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

volumes:
  the-game-data:
    external: true
    name: the-game_the-game-data

networks:
  tools-network:
    driver: bridge
