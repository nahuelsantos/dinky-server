services:
  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: unless-stopped
    ports:
      - "3500:3000"
    volumes:
      # Mount the-game production database (using named volume)
      - the-game-data:/the-game:ro
      # DbGate configuration and connection data
      - dbgate-data:/root/.dbgate
    environment:
      - CONNECTIONS=sqlite
      - TZ=Europe/Madrid
    networks:
      - tools-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dbgate.rule=Host(`dbgate.dinky.local`)"
      - "traefik.http.routers.dbgate.entrypoints=web"
      - "traefik.http.services.dbgate.loadbalancer.server.port=3000"

volumes:
  dbgate-data:
    driver: local
  the-game-data:
    external: true
    name: the-game_the-game-data

networks:
  tools-network:
    driver: bridge

